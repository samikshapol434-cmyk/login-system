<title>Firebase Student Database</title>

<style>
    body {
        font-family: Arial, sans-serif;
        background: #f4f4f4;
        margin: 0;
        padding: 0;
    }

    .container {
        width: 350px;
        margin: 50px auto;
        background: #ffffff;
        padding: 20px;
        border-radius: 10px;
        box-shadow: 0 0 10px gray;
    }

    h2 {
        text-align: center;
        color: #333;
    }

    input {
        width: 95%;
        padding: 10px;
        margin: 8px 0;
        border: 1px solid #ccc;
        border-radius: 5px;
    }

    button {
        padding: 10px 20px;
        margin: 5px;
        cursor: pointer;
        border: none;
        border-radius: 5px;
        background: #007bff;
        color: white;
    }

    button:hover {
        background: #0056b3;
    }

    #output {
        margin-top: 20px;
        padding: 10px;
    }

    .logout {
        text-align: center;
        margin-top: 20px;
    }

    .logout button {
        background: #dc3545;
    }

    .logout button:hover {
        background: #a71d2a;
    }
</style>
```

</head>

<body>

```
<div class="container">

    <h2>Firebase Student Database</h2>

    <input type="text" id="name" type="text" placeholder="Enter Name">

    <input type="number" id="age" type="number" placeholder="Enter Age">

    <input type="email"  id="email" type="email" placeholder="Enter Email ID">

    <input type="text" id="mobile" type="text" placeholder="Enter Mobile No">

    <button onclick="saveData()">Save</button>

    <button onclick="showData()">Show Data</button>

    <div id="output"></div>

    <div class="logout">
        <a href="login.html">
            <button type="button">login</button>
        </a>
    </div>

</div>
