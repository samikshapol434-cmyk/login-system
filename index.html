<!DOCTYPE html>
<html lang="mr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Firebase Login System</title>
<style>
body {
font-family: Arial, sans-serif;
background-color: #f4f4f9;
display: flex;
justify-content: center;
align-items: center;
height: 100vh;
margin: 0;
}
.container {
background: #ffffff;
padding: 25px;
border-radius: 8px;
box-shadow: 0 4px 10px rgba(0,0,0,0.1);
width: 320px;
}
h2 { text-align: center; color: #333; }
input {
width: 100%;
padding: 10px;
margin: 8px 0;
box-sizing: border-box;
border: 1px solid #ccc;
border-radius: 4px;
}
button {
width: 100%;
padding: 10px;
background-color: #0275d8;
color: white;
border: none;
border-radius: 4px;
cursor: pointer;
margin-top: 10px;
}
button:hover { background-color: #025aa5; }
.toggle-btn { background-color: #5cb85c; }
.toggle-btn:hover { background-color: #4cae4c; }
</style>

<!-- Firebase SDK Libraries (v8 CDN Version) -->
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body>

<div class="container">
<h2 id="formTitle">Login System</h2>
<input type="text" id="username" placeholder="your name" style="display: none;">
<input type="email" id="email" placeholder="Email ID" required>
<input type="password" id="password" placeholder="Password" required>
<button id="loginBtn" onClick="login()">Login</button>
<button id="registerBtn" onClick="register()" style="display: none;">Register</button>
<button class="toggle-btn" id="toggleBtn" onClick="toggleForm()">Register</button>
</div>

<script>
const firebaseConfig = {
apiKey: "AIzaSyBSu3FwaXk9-tGPvy7VTKekIQFTVCgckdk",
authDomain: "database-92855.firebaseapp.com",
databaseURL: "https://database-92855-default-rtdb.asia-southeast1.firebasedatabase.app",
projectId: "database-92855",
storageBucket: "database-92855.firebasestorage.app",
messagingSenderId: "629161322645",
appId: "1:629161322645:web:b560b8bfd484c611b6139c",
};

// Firebase Initialize
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const database = firebase.database();

let isLoginView = true;

function toggleForm() {
isLoginView = !isLoginView;
const title = document.getElementById("formTitle");
const usernameInput = document.getElementById("username");
const loginBtn = document.getElementById("loginBtn");
const registerBtn = document.getElementById("registerBtn");
const toggleBtn = document.getElementById("toggleBtn");

if (isLoginView) {
title.innerText = "Login System";
usernameInput.style.display = "none";
loginBtn.style.display = "block";
registerBtn.style.display = "none";
toggleBtn.innerText = "Register";
} else {
title.innerText = "New Registration";
usernameInput.style.display = "block";
loginBtn.style.display = "none";
registerBtn.style.display = "block";
toggleBtn.innerText = "Login";
}
}

// Register Function
function register() {
const username = document.getElementById("username").value;
const email = document.getElementById("email").value;
const password = document.getElementById("password").value;

if (!email || !password || !username) {
alert("Fill all fields");
return;
}

auth.createUserWithEmailAndPassword(email, password)
.then((userCredential) => {
const user = userCredential.user;
database.ref('users/' + user.uid).set({
username: username,
email: email,
createdAt: new Date().toISOString()
}).then(() => {
alert("Registration Done! Now Login.");
toggleForm();
});
})
.catch((error) => {
alert("Error: " + error.message);
});
}

// Login Function (Redirects to dashboard.html)
function login() {
const email = document.getElementById("email").value;
const password = document.getElementById("password").value;

if (!email || !password) {
alert("Enter Email and Password");
return;
}

auth.signInWithEmailAndPassword(email, password)
.then((userCredential) => {
alert("Login successful!");
window.location.href = "login.html";
})
.catch((error) => {
alert("Login Failed: " + error.message);
});
}
</script>

</body>
</html>
